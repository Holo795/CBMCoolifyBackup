name: CI

# Runs the same checks CONTRIBUTING.md asks contributors to run locally, on every
# pull request to main (and on pushes to main). Required to pass before merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The image workflow runs these checks first and only publishes when they pass.
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    # `prisma generate` (run by the controller's postinstall) loads prisma.config
    # which requires DATABASE_URL to resolve. Generation is offline and never
    # connects, so a placeholder is enough to satisfy config loading in CI.
    env:
      DATABASE_URL: postgresql://cbm:cbm@localhost:5432/cbm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The lockfile is refreshed from Linux so it carries the Linux-only optional
      # deps; `npm ci` then installs exactly what it pins (as the Dockerfiles do).
      # postinstall generates the Prisma client (needed for the controller type-check).
      - name: Install
        run: npm ci --no-audit --no-fund

      # A known high or critical vulnerability in what runs in production
      # (dev tooling aside) fails the checks - and with them the image release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (all packages)
        run: npm run lint

      # The wiki is built from docs/: a page missing from the build or a link to
      # a heading that doesn't exist fails here, before it reaches main.
      - name: Docs (wiki build)
        run: node scripts/build-wiki.mjs docs /tmp/wiki-out

      # Builds @cbm/shared first, then type-checks the agent and controller.
      - name: Type-check (all packages)
        run: npm run typecheck

      - name: Unit tests (shared + agent + controller)
        run: npm test

      - name: Build (all packages)
        run: npm run build

  # The agent's tests that drive Docker: real database dumps and restores,
  # freezes, restic repositories, sandboxes, an SSH server, with the agent image
  # built from this commit as the helper image. They used to run only on a
  # maintainer's machine before a release.
  agent-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://cbm:cbm@localhost:5432/cbm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # sshpass: the SSH host key test signs in with a password, like a
      # password-auth destination does.
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Build the shared package
        run: npm run build:shared

      - name: Build the agent image
        run: docker build --load -f Dockerfile.agent -t cbm-agent:ci .

      - name: Agent tests with Docker
        working-directory: packages/agent
        env:
          AGENT_HELPER_IMAGE: cbm-agent:ci
          CBM_DOCKER_TESTS: "1"
        run: npx tsx --test test/*.test.ts
