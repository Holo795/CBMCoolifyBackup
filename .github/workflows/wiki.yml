# Publish docs/ to the GitHub wiki (scripts/build-wiki.mjs). docs/ stays the
# source of truth, versioned with the code; the wiki is overwritten on each run.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-wiki.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the wiki pages
        run: node scripts/build-wiki.mjs docs wiki-out

      - name: Push them to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki-out/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
          else
            git commit -m "Sync from ${GITHUB_SHA::7}"
            git push
          fi
